name: Update stats

on:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  stats:
    runs-on: ubuntu-latest
    env:
      STATS_TOKEN: ${{ secrets.STATS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Generate
        if: env.STATS_TOKEN != ''
        run: node scripts/generate-stats.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.STATS_TOKEN }}
      - name: Commit
        if: env.STATS_TOKEN != ''
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets
          git diff --cached --quiet || git commit -m 'Update stats'
          git push
